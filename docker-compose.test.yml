name: test_api

networks:
  pulse_test_network:
    external: true

services:
  test_db:
    image: postgres
    shm_size: 128mb
    environment:
        POSTGRES_USER: tests_us
        POSTGRES_PASSWORD: tests
        POSTGRES_DB: pulse_db_tests
    ports:
      - 5433:5432      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tests_us -d pulse_db_tests"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - pulse_test_network

    
  test_redis:
    image: redis:7-alpine
    ports:
      - 6380:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - default
      - pulse_test_network


  test_migrations:
    build: .
    command: alembic upgrade head
    depends_on:
      test_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://tests_us:tests@test_db:5432/pulse_db_tests

