<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Analytics</title>
    <link
        rel="stylesheet"
        href="/static/css/dashboard.css"
    >
</head>
<body>
    <main class="page">
        <header class="header">
            <div>
                <p class="eyebrow">Analytics</p>
                <h1>Dashboard</h1>
                <p class="header-subtitle">
                    Управляйте проектами и переходите к аналитике из одного места.
                </p>
            </div>
        </header>

        <section class="layout">
            <aside class="card add-card">
                <h2 class="section-title">Добавить проект</h2>
                <p class="section-caption">Введите API key проекта, чтобы получить к нему доступ.</p>

                <form id="add-project-form" novalidate>
                    <label class="field-label" for="api-key">API key</label>
                    <div class="input-wrap">
                        <input
                            class="input"
                            id="api-key"
                            name="api_key"
                            type="password"
                            autocomplete="off"
                            placeholder="Введите ключ"
                            required
                        >
                    </div>

                    <button class="submit" id="submit-button" type="submit">
                        Добавить проект
                    </button>

                    <div class="status" id="form-status" aria-live="polite"></div>
                </form>
            </aside>

            <section class="card projects-card" aria-labelledby="projects-title">
                <div class="projects-head">
                    <h2 class="section-title" id="projects-title">Мои проекты</h2>
                    <span class="count" id="projects-count">0</span>
                </div>

                <div class="projects-list" id="projects-list"></div>

                <div class="state hidden" id="loading-state">Загрузка проектов…</div>
                <div class="state hidden" id="empty-state">У вас пока нет доступных проектов.</div>
                <div class="state hidden" id="error-state">Не удалось загрузить проекты.</div>
            </section>
        </section>
    </main>

    <script src="/static/js/dashboard.js" defer></script>
</body>
</html>
